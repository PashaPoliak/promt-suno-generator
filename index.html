<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: #000; font-family: sans-serif;
        }
        #v { width: 100vw; height: 100vh; object-fit: cover; }
        .shutter {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 70px; height: 70px; background: #fff; border-radius: 50%; border: none;
            cursor: pointer; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        .shutter:active { transform: translateX(-50%) scale(0.9); }
    </style>
</head>
<body>
    <video id="v" autoplay playsinline></video>
    <button class="shutter" onclick="snap()"></button>
    <canvas id="c" style="display:none;"></canvas>
    <script>
        const v = document.getElementById('v');

        navigator.mediaDevices.getUserMedia({video: {facingMode: 'environment'}})
            .then(s => v.srcObject = s);

        function snap() {
            const c = document.getElementById('c');
            c.width = v.videoWidth;
            c.height = v.videoHeight;
            c.getContext('2d').drawImage(v, 0, 0);
            c.toBlob(b => {
                const f = new FormData();
                f.append('image', b, 'p.jpg');
                fetch('/api/image', {method: 'POST', body: f});
            }, 'image/jpeg', 0.6);
        }
    </script>
</body>
</html>
